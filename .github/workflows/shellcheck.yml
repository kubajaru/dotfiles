name: Shell validation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck and Dash
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y dash shellcheck

      - name: Run ShellCheck
        run: shellcheck -s sh bootstrap.sh bootstrap.local.example.sh

      - name: Check POSIX shell syntax
        run: dash -n bootstrap.sh